onboarding = false

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[theme.custom]
panel_bg = "reset"

[theme.custom.dark]
accent = "#02EB7D"
green = "#02EB7D"

[theme.custom.light]
accent = "#00875A"
green = "#00875A"

[terminal]
default_shell = "/opt/homebrew/bin/fish"

[keys]
prefix = "ctrl+a"

new_tab = "prefix+w"
previous_tab = "prefix+["
next_tab = "prefix+]"
rename_tab = "prefix+r"

split_vertical = "prefix+h"
split_horizontal = "prefix+v"

focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

toggle_sidebar = "prefix+b"
new_workspace = "prefix+n"

workspace_picker = "prefix+l"
resize_mode = ""

[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "/Users/jeffrey/.local/bin/herdr pane swap --direction left"

[[keys.command]]
key = "prefix+shift+down"
type = "shell"
command = "/Users/jeffrey/.local/bin/herdr pane swap --direction down"

[[keys.command]]
key = "prefix+shift+up"
type = "shell"
command = "/Users/jeffrey/.local/bin/herdr pane swap --direction up"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "/Users/jeffrey/.local/bin/herdr pane swap --direction right"
